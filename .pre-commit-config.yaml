repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: ruff check
        language: python
        additional_dependencies: [ruff==0.16.8]
        types: [python]
      - id: ruff-format-check
        name: ruff format check
        entry: ruff format --check
        language: python
        additional_dependencies: [ruff==0.16.8]
        types: [python]
      - id: deptry
        name: Python dependency usage
        entry: deptry . --exclude '.venv|node_modules|\.git' --optional-dependencies-dev-groups dev,test --known-first-party app --per-rule-ignores DEP002=starlette|uvicorn|pytest-asyncio|deptry|pre-commit|ruff,DEP004=pytest
        language: python
        additional_dependencies: [deptry==0.25.1]
        pass_filenames: false
      - id: forge-check
        name: Forge JavaScript quality
        entry: npm --prefix forge run check
        language: system
        pass_filenames: false
